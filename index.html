<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة العمر بالميلادي والهجري | أداة مجانية</title>
<meta name="description" content="احسب عمرك بالسنوات والشهور والأيام، وتاريخ ميلادك بالهجري، والعد التنازلي لعيد ميلادك القادم. دون إرسال أي بيانات.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:1.6rem 1rem;text-align:center}
header h1{font-size:1.5rem}
.tagline{opacity:.92;font-size:.95rem;margin-top:.25rem}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:1rem}
.card{background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 4px rgba(15,23,42,.08);margin-bottom:1rem}
.card h2{font-size:1.1rem;margin-bottom:.4rem;color:#0f766e}
label{display:block;font-weight:700;margin:.75rem 0 .3rem}
input,select,textarea{width:100%;padding:.7rem .8rem;border:1.5px solid #cbd5e1;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:#1e293b}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(20,184,166,.18)}
.row{display:flex;gap:.6rem}
.row>*{flex:1;min-width:0}
button{display:inline-block;width:100%;padding:.8rem;border:0;border-radius:10px;background:#0f766e;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:1rem}
button:hover{background:#115e59}
button.ghost{background:#e2e8f0;color:#1e293b}
.result{background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:10px;padding:1rem;margin-top:1rem;font-size:1.05rem;word-break:break-word}
.result b{color:#047857}
.result.warn{background:#fffbeb;border-color:#fcd34d}
.result.warn b{color:#b45309}
.result.bad{background:#fef2f2;border-color:#fca5a5}
.result.bad b{color:#b91c1c}
.muted{color:#64748b;font-size:.85rem}
footer{background:#0f172a;color:#94a3b8;text-align:center;padding:1.2rem 1rem;font-size:.85rem;line-height:1.9}
footer a{color:#5eead4}
table{width:100%;border-collapse:collapse;margin-top:.5rem}
th,td{padding:.5rem;border-bottom:1px solid #e2e8f0;text-align:right;font-size:.95rem}
.big{font-size:1.6rem;font-weight:800}
.hidden{display:none}
.chk{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
.chk input{width:auto}

</style>
</head>
<body>
<header>
<h1>حاسبة العمر</h1>
<p class="tagline">عمرك بالضبط: سنوات وشهور وأيام، بالميلادي والهجري</p>
</header>
<main>
<div class="card">
<h2>تاريخ ميلادك</h2>
<label for="birth">تاريخ الميلاد</label>
<input type="date" id="birth">
<label for="ref">احسب العمر في تاريخ (اتركه اليوم)</label>
<input type="date" id="ref">
<button onclick="calc()">احسب عمري</button>
</div>
<div id="out" class="result hidden"></div>

</main>
<footer>
<p>تعمل هذه الأداة بالكامل على جهازك، ولا تُحفظ أو تُرسل أي بيانات إلى أي خادم.</p>
<p>أداة مجانية مفتوحة المصدر · بُنيت بمساعدة أدوات ذكاء اصطناعي · <a href="https://github.com/abood-ayman/age-calculator-ar">الكود على GitHub</a></p>
</footer>
<script>
window.__jserrors=[];window.addEventListener('error',function(e){window.__jserrors.push(String(e.message))});
const g = id => document.getElementById(id);

function calcAge(bd, ref) {
  let y = ref.getFullYear() - bd.getFullYear();
  let m = ref.getMonth() - bd.getMonth();
  let d = ref.getDate() - bd.getDate();
  let mo = ref.getMonth(), yr = ref.getFullYear();
  while (d < 0) { m--; mo--; if (mo < 0) { mo = 11; yr--; } d += new Date(yr, mo + 1, 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return { y, m, d };
}

function nextBirthday(bd, ref) {
  let nb = new Date(ref.getFullYear(), bd.getMonth(), bd.getDate());
  if (nb <= ref) nb = new Date(ref.getFullYear() + 1, bd.getMonth(), bd.getDate());
  return Math.round((nb - ref) / 86400000);
}

function hijri(d) {
  try {
    return new Intl.DateTimeFormat('ar-SA-u-ca-islamic', { day: 'numeric', month: 'long', year: 'numeric' }).format(d);
  } catch (e) { return 'غير متاح على هذا المتصفح'; }
}

function calc() {
  const bv = g('birth').value;
  if (!bv) return;
  const bd = new Date(bv + 'T00:00:00');
  const rv = g('ref').value;
  const ref = rv ? new Date(rv + 'T00:00:00') : new Date();
  const a = calcAge(bd, ref);
  const days = Math.floor((ref - bd) / 86400000);
  const weekday = new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(bd);
  const el = g('out');
  el.classList.remove('hidden');
  el.innerHTML =
    '<p class="big">عمرك: <b>' + a.y + ' سنة و ' + a.m + ' شهرًا و ' + a.d + ' يومًا</b></p>' +
    '<p>إجمالي الأيام: <b>' + days.toLocaleString('ar-EG') + ' يوم</b></p>' +
    '<p>وُلدت يوم: <b>' + weekday + '</b></p>' +
    '<p>تاريخ ميلادك بالهجري: <b>' + hijri(bd) + '</b></p>' +
    '<p>المتبقي لعيد ميلادك القادم: <b>' + nextBirthday(bd, ref) + ' يوم</b></p>';
}

window.__test = function () {
  const r = calcAge(new Date(2005, 9, 17), new Date(2026, 10, 25));
  const same = calcAge(new Date(2000, 0, 1), new Date(2000, 0, 1));
  const borrow = calcAge(new Date(2000, 11, 31), new Date(2001, 0, 1));
  const across = calcAge(new Date(2000, 0, 31), new Date(2000, 2, 1));
  const nb = nextBirthday(new Date(2005, 9, 17), new Date(2026, 10, 25));
  const ok = r.y === 21 && r.m === 1 && r.d === 8 &&
             same.y === 0 && same.m === 0 && same.d === 0 &&
             borrow.y === 0 && borrow.m === 0 && borrow.d === 1 &&
             across.y === 0 && across.m === 0 && across.d === 30 &&
             nb === 326;
  return { pass: ok, details: { r, same, borrow, nb } };
};

window.__demo = function () {
  g('birth').value = '2005-10-17';
  calc();
};

</script>
</body>
</html>
